actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. The MemberClicks MC Professional API
    is a request/response JSON REST API secured with OAuth 2.0, with no
    documented server-push (WebSocket/SSE) transport. No AsyncAPI document was
    created because there is no streaming transport on the MemberClicks API to
    model.
