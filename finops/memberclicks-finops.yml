description: >-
  FinOps view of MemberClicks spend. MemberClicks (by Personify) is sold as an
  annual SaaS platform subscription (MC Professional or MC Trade), not as a
  metered API. The MC Professional REST API is included with the subscription at
  no separate per-call charge, so API usage does not directly generate variable
  cost. The dominant cost drivers are the annual platform subscription (quoted by
  organization size and needs) and one-time implementation / data-migration fees.
  There is no usage-based API billing to meter or optimize.
notes: >-
  Exact subscription rates are quote-based and not reconciled here. Because the
  API carries no separate metered charge, FinOps attention is on the fixed annual
  subscription and one-time implementation costs rather than on API call volume.
