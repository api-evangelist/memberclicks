meters:
- name: platform_subscription
  description: Annual MC Professional / MC Trade platform subscription (includes API access).
  unit: contract-year
  aggregation: sum
  dimensions:
  - organization
  - edition
- name: implementation_fee
  description: One-time implementation, data migration, and onboarding.
  unit: project
  aggregation: sum
  dimensions:
  - organization
principles:
- name: Visibility
  description: Track the annual subscription and any one-time implementation fees; the API itself is unmetered and adds no variable charge.
- name: Allocation
  description: Attribute the platform subscription to the association / membership program it runs; there is no per-call cost to split.
- name: Optimization
  description: Right-size the edition (MC Professional vs MC Trade) to the organization's needs; negotiate implementation scope; use the included API rather than paid add-ons where possible.
- name: Accountability
  description: Review the annual renewal against usage of platform capabilities; assign an owner for the subscription and API credentials.
