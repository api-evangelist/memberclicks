aid: memberclicks
url: https://raw.githubusercontent.com/api-evangelist/memberclicks/refs/heads/main/apis.yml
name: MemberClicks
kind: company
description: MemberClicks is association and membership management software owned by
  Personify (marketed as "MemberClicks by Personify"). Its flagship MC Professional
  platform (formerly branded "Oasis") is an all-in-one AMS for professional
  associations, chambers, and trade groups - covering member profiles and databases,
  dues and invoicing, event registration, email and communications, community groups,
  and websites. MemberClicks exposes a documented public/partner developer API - the
  MC Professional API, a JSON REST interface protected by the OAuth 2.0 authorization
  framework and hosted per organization at https://{orgId}.memberclicks.net. The API
  is intended for developers with technical expertise; MemberClicks support does not
  assist with custom integrations. Access to profile, event, and related data is
  gated behind per-organization OAuth client credentials rather than open self-serve
  signup.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: true
  try_now: true
  public: false
  label: Paid (free trial) · Self-serve signup
