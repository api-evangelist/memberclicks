  humanURL: https://help.memberclicks.com/hc/en-us/articles/15442877631373-API-Resources-Attributes
  baseURL: https://{orgId}.memberclicks.net/api/v1
  properties:
  - url: https://help.memberclicks.com/hc/en-us/articles/15442877631373-API-Resources-Attributes
    type: APIReference
  - url: openapi/memberclicks-openapi.yml
    type: OpenAPI
  description: Describe the profile schema - list attributes (built-in and custom
    fields) and retrieve the selection-set options for a given attribute via
    /api/v1/attribute/{attributeId}/selection. Used to map an organization's custom
    membership fields before reading or writing profiles.
