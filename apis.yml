apis:
- aid: memberclicks:memberclicks-profiles-api
  name: MemberClicks Profiles API
  tags:
  - Profiles
  - Members
  - Contacts
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.memberclicks.com/hc/en-us/articles/15442882233485-API-Resources-Retrieve-Profiles
  baseURL: https://{orgId}.memberclicks.net/api/v1
  properties:
  - url: https://help.memberclicks.com/hc/en-us/articles/15442876413197-API-Resources
    type: Documentation
  - url: https://help.memberclicks.com/hc/en-us/articles/15442882233485-API-Resources-Retrieve-Profiles
    type: APIReference
  - url: openapi/memberclicks-openapi.yml
    type: OpenAPI
  description: Retrieve, create, and update member/contact profiles - the core people
    records in MC Professional. List all profiles (paged), get a single profile by
    profileId, create new profiles, and update existing profile attributes. Requests
    are JSON over HTTPS with an OAuth 2.0 bearer access token.
- aid: memberclicks:memberclicks-profile-search-api
  name: MemberClicks Profile Search API
  tags:
  - Search
  - Profiles
  - Query
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.memberclicks.com/hc/en-us/articles/15442958956813-API-Resources-Profile-Search
  baseURL: https://{orgId}.memberclicks.net/api/v1
  properties:
  - url: https://help.memberclicks.com/hc/en-us/articles/15442958956813-API-Resources-Profile-Search
    type: APIReference
  - url: openapi/memberclicks-openapi.yml
    type: OpenAPI
  description: Create a profile search by POSTing search criteria to /api/v1/profile/search,
    then page through the matching profiles. Lets integrations filter the membership
    database by attributes rather than retrieving every profile.
- aid: memberclicks:memberclicks-attributes-api
